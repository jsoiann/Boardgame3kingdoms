<!doctype html>
<html lang="zh-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>天下三分</title>
<style>
:root{--bg:#e8e2d2;--ink:#232a30;--pn:#f3eee2;--ln:#b9ad92;--red:#b5483a;--jade:#2f5d62}
@media(prefers-color-scheme:dark){:root{--bg:#161c20;--ink:#e3ddcd;--pn:#222b30;--ln:#44525a;--red:#e0705f;--jade:#6cb5b0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Noto Serif TC","Songti TC",serif;padding:10px 16px;max-width:1100px;margin:auto}
h1{font-size:30px;letter-spacing:.35em;margin:.3em 0;color:var(--red)}
button{font:inherit;color:inherit;background:var(--pn);border:1px solid var(--ln);border-radius:3px;padding:6px 10px;margin:2px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--jade)}button:focus-visible{outline:2px solid var(--jade)}button:disabled{opacity:.45;cursor:default}
button.m{display:block;width:100%;max-width:520px;text-align:left;padding:14px;margin:8px 0}button.m small{display:block}
img{display:block}.lg{opacity:.75;font-size:12px}
.pn{background:var(--pn);border-left:4px solid var(--ln);padding:6px 10px;margin:8px 0;display:flex;gap:10px;align-items:center}.pn img.fl{height:46px}
.tk{display:flex;align-items:center;gap:10px;margin:10px 0 4px}.tk>span{width:48px;display:flex;flex-direction:column;align-items:center;font-size:12px}.tk>span img{height:28px}.tb{flex:1}
.bar{height:16px;position:relative;border-radius:3px;margin:20px 0 2px}.bar:before{content:"";position:absolute;left:50%;top:-4px;height:24px;border-left:2px solid var(--ink)}
.bar i{position:absolute;top:-24px;font-style:normal;font-size:28px;color:var(--ink);text-shadow:0 0 3px #fff;transform:translateX(-25%);transition:left .4s}
.tick{display:flex;justify-content:space-between;font-size:11px;opacity:.7}
.tn{display:flex;justify-content:space-between;align-items:center;margin-top:2px}.pl{color:#fff;padding:1px 10px;border-radius:10px;font-size:13px}.cur{font-size:22px}
.main{display:grid;grid-template-columns:1fr;gap:10px 20px;margin-top:12px}.main>div{min-width:0}
@media(min-width:900px){.main{grid-template-columns:1fr 1fr}}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ev{padding:0;text-align:center;font-size:12px;line-height:1.3}.ev img{width:100%;aspect-ratio:3/2;object-fit:contain}.ev.on{outline:3px solid var(--red)}.ev small{display:block;padding:2px}
.mk,.hand{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.mk button{margin:0;font-size:13px}.mk img{height:46px;margin:0 auto 2px}
.un{display:flex;gap:6px;justify-content:space-around;margin:10px 0}.un div{text-align:center;font-size:13px}.un img{height:64px;margin:auto}
.un b{display:inline-block;min-width:26px;border:2px solid var(--ink);border-radius:50%;font-size:16px}
.rs{position:relative;display:flex;align-items:center;gap:10px;height:78px;background:var(--pn);border:2px solid var(--jade);padding:0 12px 0 84px;margin:26px 0 8px 12px}
.rs .hf{position:absolute;left:-14px;top:-24px}.rs .hf img{height:112px;filter:drop-shadow(2px 3px 3px #0005)}
.rs>img{height:42px}.rs b{font-size:34px;line-height:1}.rs span{font-size:13px}
.rs em{margin-left:auto;font-style:normal;font-size:17px;line-height:21px;display:flex;flex-direction:column;justify-content:center}
.cd{background:var(--frame) center/100% 100% no-repeat;color:#232a30;padding:16% 12% 10%;text-align:center;font-size:12px;line-height:1.3;display:flex;flex-direction:column;gap:2px;min-height:170px}
.cd img{height:66px;margin:auto;object-fit:contain}.cd b{font-size:15px}.cd button{margin:auto 0 0;font-size:13px;padding:4px;color:#232a30}
.bg{background:var(--pn);padding:8px;margin:0 0 8px}
</style></head><body><div id="app"></div>

function go(a){a.p=me;if(mode=='net')Net.send(a);else if(T.step(S,a)){draw();ail()}}
function ail(){if(mode!='ai'||!S)return;const a=T.ai(S,1);if(a)setTimeout(()=>{T.step(S,a);draw();ail()},450)}
function onAct(a){if(!S)buf.push(a);else{T.step(S,a);draw()}}
function begin(m,seed,idx,rdy){mode=m;me=idx;ready=rdy;S=T.mk(seed);buf.splice(0).forEach(a=>T.step(S,a));draw()}
function menu(){S=null;mode='';buf.length=0;location.hash='';$.innerHTML=`<h1>天下三分</h1><p class=lg>兩人輕策略 · 魏蜀吳 · 公開資訊 · 約 25 分鐘</p>
<button class=m onclick=quick()>隨機配對<small>同線上陌生玩家對戰</small></button>
<button class=m onclick=room()>開房間<small>生成連結，俾朋友入嚟玩</small></button>
<button class=m onclick="begin('ai',Date.now()%1e9,0,1)">對電腦<small>單人測試規則</small></button>`}
async function quick(){if(!Net.init())return;$.innerHTML='<h1>天下三分</h1><p>配對緊…</p><button onclick=location.reload()>取消</button>';
 const r=await Net.quick(onAct,()=>{ready=1;draw()});if(r.guest&&r.seed==null)return menu();begin('net',r.seed,Net.me,r.guest?1:0)}
async function room(){if(!Net.init())return;const r=await Net.make(onAct,()=>{ready=1;draw()});link=location.origin+location.pathname+'#'+r.id;begin('net',r.seed,0,0)}
async function joinRoom(id){if(!Net.init())return;const s=await Net.join(id,onAct);if(s==null)return menu();begin('net',s,1,1)}
// 軍威/民心：左＝對手國色，右＝自己國色；v 由自己角度，正數＝我領先
const trk=(v,lb,ic,oc,mc)=>`<div class=tk><span>${IM(ic)}${lb}</span><div class=tb><div class=bar style="background:linear-gradient(90deg,${oc} 50%,${mc} 50%)"><i style="left:${(v+10)*5}%">⚑</i></div>
<div class=tick><span>−10</span><span>−5</span><span>0</span><span>+5</span><span>+10</span></div>
<div class=tn><span class=pl style="background:${oc}">◀ 對手再 ${10+v} 格勝</span><b class=cur>${v>0?'+':''}${v}</b><span class=pl style="background:${mc}">我再 ${10-v} 格勝 ▶</span></div></div></div>`;
const abt=g=>[...g.ab].map(c=>T.AB[c]).join('、');
const eff=g=>g.ty=='武'?`${g.us.map(x=>T.UN[x]).join('/')} +${g.pw}`:`民心+${Math.min(g.pw,2)}（一次）`;
const card=(g,btn)=>`<div class=cd>${IM('p_'+g.name)}<b>${esc(g.name)}${g.x?'★':''}</b><span>${g.ty}・${eff(g)}</span><span>${abt(g)||'—'}</span>${btn}</div>`;
function draw(){if(!S)return;
 if(mode=='net'&&!ready){$.innerHTML=`<h1>天下三分</h1><p>等緊對手加入…</p>${link?`<p>將呢條連結傳俾朋友：<br><a href="${link}">${link}</a></p>`:''}`;return}
 const my=S.P[me],op=S.P[1-me],d=S.d;let h='';
 if(S.st=='nation'){$.innerHTML=`<h1>天下三分</h1><p>揀你嘅國家（雙方唔可以相同）</p>`+['wei','shu','wu'].map(n=>`<button class=m ${S.nat[me]||S.nat[1-me]==n?'disabled':''} onclick="go({t:'nat',n:'${n}'})"><div style="display:flex;gap:12px;align-items:center"><div style="width:60px">${IM('f_'+n)}</div><div>${T.NN[n]}<small>${{wei:'資源多：第 2 階段起每回合 +1',shu:'招攬武將 −1 資源；開局民心 +1（一次）',wu:'長江天險：軍威負值 −2'}[n]}</small></div></div></button>`).join('')+(S.nat[me]?'<p class=lg>等對手選擇…</p>':'');return}
 const bl=P=>`軍營${P.b.b} 市場${P.b.m} 糧倉${P.b.g}`,oc=NC[op.n],mc=NC[my.n],mt=S.st=='round'&&S.turn==me;
 h+=`<div class=pn style="border-color:${oc}">${IM('f_'+op.n,'fl')}<div><b>對手・${T.NN[op.n]}</b>　資源 ${op.res}<br><span class=lg>${T.U.map(x=>T.UN[x]+op.u[x]).join(' ')}｜${bl(op)}｜武將 ${op.gen.length}</span></div></div>`;
 h+=trk(me?-S.pos:S.pos,'軍威','drum',oc,mc)+trk(me?-S.mpos:S.mpos,'民心','lan',oc,mc);
 h+=`<div class=lg style="margin-top:8px">第 ${S.ph} 階段${S.st=='round'?'・第 '+S.rd+' 回合':''}${S.st=='event'?'　'+(S.ev.c==me?'請你揀一個事件（必定執行；落喺該國玩家身上，該國唔喺場則落喺揀嘅人）':'等對手揀事件…'):''}</div><div class=main>`;
 // ① 事件
 h+=`<div><div class=row>`+S.ev.o.map((e,i)=>`<button class="ev ${S.ev.pick==i?'on':''}" ${S.st=='event'&&S.ev.c==me?'':'disabled'} onclick="go({t:'ev',i:${i}})">${IM('e_'+e.nat+S.ph)}<small><b>${e.n}</b>（${T.NN[e.nat]}）<br>${T.fx(e.t)}</small></button>`).join('')+`</div></div>`;
 // ② 市集／選將／結算
 h+=`<div>`;
 if(S.st=='round')h+=`<div class=bg><b>${mt?'輪到你':'等對手…'}</b> <span class=lg>市集（預告：${S.mk.deck.slice(0,2).map(c=>c.t=='u'?T.UN[c.x]+'升級':T.BN[c.x]+'升級').join('、')||'—'}）</span></div><div class=mk>`+
  S.mk.up.map((c,i)=>{const k=T.cc(my,c);return`<button ${mt&&k>=0&&my.res>=k?'':'disabled'} onclick="go({t:'buy',i:${i}})">${IM(c.t=='u'?'u_'+c.x:c.x=='g'?'g':c.x+Math.min(4,my.b[c.x]+1))}${c.t=='u'?T.UN[c.x]+'兵+1':T.BN[c.x]+'升級'}<br><b>${k<0?'已滿':'$'+k}</b></button>`}).join('')+`</div>`;
 if(S.st=='draft'){const pk=d.step%2==0,mine=!d.done[me],L=pk?my.pool:op.pool;
  h+=`<div class=bg><b>${pk?'揀一位武將入手牌':'替對手棄一位武將'}</b>${mine?'':' <span class=lg>等對手…</span>'}</div><div class=hand>`+L.map((g,i)=>card(g,`<button ${mine?'':'disabled'} onclick="go({t:'${pk?'pick':'drop'}',i:${i}})">${pk?'揀':'棄'}・$${g.cost}</button>`)).join('')+`</div>`}
 if(S.st=='settle')h+=`<div class=bg><b>階段結算：軍營加持邊個兵種？</b>${S.set[me]?' <span class=lg>等對手…</span>':''}<br>`+T.U.map(x=>`<button ${S.set[me]?'disabled':''} onclick="go({t:'bar',x:'${x}'})">${T.UN[x]}</button>`).join('')+`</div>`;
 if(S.st=='end'){const w=S.win;h+=`<div class=bg><b style="font-size:20px">${w==2?'平手':w==me?'你勝出！':'對手勝出'}</b><br><button onclick="menu()">返回主頁</button></div>`}
 h+=`</div>`;
 // ③ 我嘅資源（國旗似手咁喺最左）＋兵種
 h+=`<div><div class=rs><div class=hf>${IM('f_'+my.n)}</div>${IM('res')}<div><span>我嘅資源</span><br><b>${my.res}</b></div><em><div>軍營 <b>Lv${my.b.b}</b></div><div>市場 <b>Lv${my.b.m}</b></div><div>糧倉 <b>Lv${my.b.g}</b></div></em></div>
  <div class=un>${T.U.map(x=>`<div>${IM('u_'+x)}${T.UN[x]} <b>${my.u[x]}</b></div>`).join('')}</div></div>`;
 // ④ 手牌
 h+=`<div><div class=lg>我嘅手牌（待招攬武將）</div><div class=hand>`+my.kept.map((g,i)=>{const c=T.gc(S,me,g);return card(g,S.st=='round'?`<button ${mt&&my.res>=c?'':'disabled'} onclick="go({t:'rec',i:${i}})">招攬 $${c}</button>`:`<span>$${c}</span>`)}).join('')+`</div>${S.st=='round'?`<button ${mt?'':'disabled'} onclick="go({t:'pass'})">結束本回合（Pass）</button>`:''}</div></div>`;
 h+=`<p class=lg>武將區：${my.gen.map(g=>esc(g.name)+(g.ab?'['+abt(g)+']':'')).join('、')||'—'}</p><div class=lg>${S.log.slice(-5).map(esc).join('<br>')}</div>`;
 $.innerHTML=h}
if(location.hash.length>1)joinRoom(location.hash.slice(1));else menu();
</script></body></html>
